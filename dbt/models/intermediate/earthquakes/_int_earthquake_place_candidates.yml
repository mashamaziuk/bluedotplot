version: 2

models:
  - name: int_earthquake_place_candidates
    description: >
      Intermediate model identifying populated places that provide
      geographic context for recent earthquake events.

      Grain: one row per earthquake-place relationship.

      Candidate places are selected using a magnitude-dependent search
      radius and GeoNames populated-place data. The model identifies
      the nearest populated place, up to three additional large populated
      places, and a nearby capital city when applicable.

      The candidate search radius is a Blue Dot Plot heuristic and is
      not intended to represent a seismic hazard zone, felt-shaking
      boundary, or area of safety.

      The model contains candidate relationships for earthquakes from
      the most recent 14 days.

    columns:

      - name: event_id
        description: >
          Unique identifier of the seismic event from the USGS earthquake catalog.
        data_tests:
          - not_null

      - name: updated_at_utc
        description: >
          Timestamp when the earthquake record was last updated in the
          USGS earthquake catalog. Used to identify new or updated events
          during incremental processing.
        data_tests:
          - not_null

      - name: magnitude
        description: >
          Earthquake magnitude reported by the USGS catalog.

      - name: candidate_search_radius_km
        description: >
          Magnitude-dependent geographic search radius used to identify
          candidate populated places. This is a Blue Dot Plot heuristic
          for defining the geographic search window and is not intended
          to represent a seismic hazard zone, felt-shaking boundary,
          or area of safety.

      - name: geoname_id
        description: >
          Unique GeoNames identifier of the candidate populated place.
        data_tests:
          - not_null

      - name: place_name
        description: >
          Name of the candidate populated place.

      - name: feature_code
        description: >
          GeoNames feature code describing the type of populated place.

      - name: country_code
        description: >
          Country code associated with the populated place.

      - name: population
        description: >
          Population associated with the populated place in the GeoNames
          reference dataset.

      - name: distance_km
        description: >
          Distance between the earthquake epicenter and the populated place,
          in kilometers.

      - name: distance_miles
        description: >
          Distance between the earthquake epicenter and the populated place,
          in miles.

      - name: candidate_type
        description: >
          Category under which the place was selected:
          nearest_populated_place, large_populated_place, or capital_city.