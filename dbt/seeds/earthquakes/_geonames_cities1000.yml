version: 2

seeds:
  - name: geonames_cities1000
    description: >
      Worldwide populated places dataset from GeoNames cities1000.
      Used as a geographic reference for earthquake spatial enrichment.
      Source: GeoNames, licensed under CC BY 4.0.

    columns:
      - name: geoname_id
        description: >
          Unique identifier of the populated place in the GeoNames database.

      - name: place_name
        description: >
          Name of the populated place.

      - name: latitude
        description: >
          Latitude of the populated place in decimal degrees (WGS84).

      - name: longitude
        description: >
          Longitude of the populated place in decimal degrees (WGS84).

      - name: feature_code
        description: >
          GeoNames feature code describing the type of populated place.

      - name: country_code
        description: >
          ISO-3166 two-letter country code.

      - name: population
        description: >
          Population associated with the populated place in GeoNames.